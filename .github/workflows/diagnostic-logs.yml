# TEMPORARY read-only diagnostic: checks Delhivery webhook delivery + label JSON.
# Safe: only reads logs, mutates nothing. Remove after diagnosis.
name: Diagnostic Logs

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Substring to filter backend logs"
        required: false
        default: "DELHIVERY LABEL"
        type: string

permissions:
  contents: read

jobs:
  dump-logs:
    name: Dump VPS logs
    runs-on: ${{ vars.VPS_RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Label packing-slip JSON (filtered)
        run: docker logs --tail 4000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -iE "${{ inputs.grep }}" || echo "no matching label lines"

      - name: Shipping webhook activity (did Delhivery ever push?)
        run: docker logs --tail 6000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -iE "shipping/webhook|shipping webhook|webhook.*shipping|processShippingWebhook|webhook_received|webhook.*delhivery" | tail -40 || echo "no shipping webhook lines found"
