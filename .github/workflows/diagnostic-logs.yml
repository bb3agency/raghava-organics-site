# TEMPORARY read-only diagnostic: dumps backend logs filtered for the Delhivery
# pickup response so we can see why the order stays in "Ready to Ship".
# Safe: it only reads logs, mutates nothing. Remove after diagnosis.
name: Diagnostic Logs

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Substring to filter backend logs"
        required: false
        default: "DELHIVERY PICKUP"
        type: string

permissions:
  contents: read

jobs:
  dump-logs:
    name: Dump VPS logs
    runs-on: ${{ vars.VPS_RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Backend logs filtered
        run: docker logs --tail 3000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -iE "${{ inputs.grep }}|pickup|fm/request" || echo "no matching lines"
