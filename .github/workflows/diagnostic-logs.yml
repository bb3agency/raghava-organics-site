# TEMPORARY read-only diagnostic: nginx logs for the product image upload 500.
# Safe: only reads logs, mutates nothing. Remove after diagnosis.
name: Diagnostic Logs

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Substring to filter"
        required: false
        default: "images/upload"
        type: string

permissions:
  contents: read

jobs:
  dump-logs:
    name: Dump VPS logs
    runs-on: ${{ vars.VPS_RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Nginx error log (last 60 lines)
        run: |
          (sudo tail -n 60 /var/log/nginx/error.log 2>/dev/null) \
            || (tail -n 60 /var/log/nginx/error.log 2>/dev/null) \
            || echo "nginx error.log not readable"

      - name: Nginx access log for the upload URL
        run: |
          (sudo grep -aE "images/upload" /var/log/nginx/access.log 2>/dev/null | tail -10) \
            || (grep -aE "images/upload" /var/log/nginx/access.log 2>/dev/null | tail -10) \
            || echo "nginx access.log not readable / no matches"

      - name: Effective client_max_body_size + temp path in live nginx config
        run: |
          (sudo grep -rnE "client_max_body_size|client_body_temp|proxy_request_buffering|client_body_buffer_size" /etc/nginx/ 2>/dev/null | tail -30) \
            || (grep -rnE "client_max_body_size|client_body_temp|proxy_request_buffering" /etc/nginx/ 2>/dev/null | tail -30) \
            || echo "nginx config not readable"
