# TEMPORARY read-only diagnostic: dumps backend/worker container logs and the
# nginx error log from the VPS so we can see why /schedule-pickup returns 502.
# Safe: it only reads logs, mutates nothing. Remove after diagnosis.
name: Diagnostic Logs

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional substring to filter backend logs (e.g. schedule-pickup or an order id)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dump-logs:
    name: Dump VPS logs
    runs-on: ${{ vars.VPS_RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Running containers
        run: docker ps --format '{{.Names}}\t{{.Status}}' || true

      - name: Backend container logs (last 400 lines)
        run: docker logs --tail 400 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 || docker logs --tail 400 raghava-organics-backend 2>&1 || echo "backend container not found"

      - name: Backend logs filtered
        if: ${{ inputs.grep != '' }}
        run: docker logs --tail 2000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -iE "${{ inputs.grep }}|error|pickup|delhivery|502|exception|abort" || echo "no matching lines"

      - name: Worker container logs (last 200 lines)
        run: docker logs --tail 200 "${CLIENT_ID:-raghava-organics}-workers" 2>&1 || docker logs --tail 200 raghava-organics-workers 2>&1 || echo "workers container not found"

      - name: Nginx error log (last 120 lines)
        run: |
          (sudo tail -n 120 /var/log/nginx/error.log 2>/dev/null) \
            || (tail -n 120 /var/log/nginx/error.log 2>/dev/null) \
            || echo "nginx error log not readable without sudo"
