# TEMPORARY read-only diagnostic: dumps backend errors around product image upload.
# Safe: only reads logs, mutates nothing. Remove after diagnosis.
name: Diagnostic Logs

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Substring to filter backend logs"
        required: false
        default: "image|upload|R2|media|products/.*/images|level\":50"
        type: string

permissions:
  contents: read

jobs:
  dump-logs:
    name: Dump VPS logs
    runs-on: ${{ vars.VPS_RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Upload request trace (wide window)
        run: docker logs --tail 20000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -iE "images/upload|R2 |Cloudflare R2|saveProductImage|assertR2|getProductMediaStorage|NoSuchBucket|InvalidAccess|SignatureDoesNotMatch|ENOTFOUND|ECONN" | tail -40 || echo "no upload lines in window"

      - name: Backend error/upload logs (last 4000 lines, filtered)
        run: docker logs --tail 4000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -iE "${{ inputs.grep }}" | tail -50 || echo "no matching lines"

      - name: Media storage env presence (names only, values redacted)
        run: docker exec "${CLIENT_ID:-raghava-organics}-backend" sh -c 'for k in MEDIA_STORAGE_PROVIDER R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_BASE_URL R2_ENDPOINT MEDIA_CDN_BASE_URL; do v=$(printenv $k); if [ -n "$v" ]; then echo "$k=SET(len=${#v})"; else echo "$k=MISSING"; fi; done' 2>&1 || echo "could not read env"
