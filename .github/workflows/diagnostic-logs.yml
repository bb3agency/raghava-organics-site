# TEMPORARY read-only diagnostic for the product image upload 500.
# Safe: only reads logs, mutates nothing. Remove after diagnosis.
name: Diagnostic Logs

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump-logs:
    name: Dump VPS logs
    runs-on: ${{ vars.VPS_RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Did the upload reach the backend? (wide window)
        run: docker logs --tail 60000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -aiE "images/upload|Cloudflare R2|R2 upload|saveProductImage|MEDIA_STORAGE_PROVIDER=r2 requires|At least one image" | tail -30 || echo "NO upload/R2 lines — request is not reaching the backend (proxy-level 500)"

      - name: Recent backend 5xx responses
        run: docker logs --tail 8000 "${CLIENT_ID:-raghava-organics}-backend" 2>&1 | grep -aE '"statusCode":5[0-9][0-9]' | tail -15 || echo "no 5xx in window"
